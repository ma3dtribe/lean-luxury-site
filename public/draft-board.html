<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>LFL 2026 Live Draft Board</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #07101f;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    body {
      padding: 8px;
    }

    .page {
      width: 100%;
      min-height: calc(100vh - 16px);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .top-bar {
      min-height: 58px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      padding: 7px 14px;
      border: 1px solid #32435e;
      border-radius: 10px;
      background:
        linear-gradient(135deg, rgba(20, 44, 80, 0.97), rgba(7, 16, 31, 0.97));
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.35);
    }

    .league-title {
      font-size: clamp(18px, 1.65vw, 30px);
      font-weight: 900;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .league-title span {
      color: #f5b942;
    }

    .draft-status {
      text-align: center;
      white-space: nowrap;
    }

    .draft-status strong {
      display: block;
      font-size: clamp(17px, 1.45vw, 27px);
    }

    .draft-status small {
      color: #b8c5d9;
      font-size: clamp(10px, 0.78vw, 14px);
    }

    .last-updated {
      text-align: right;
      color: #c6d2e2;
      font-size: clamp(10px, 0.72vw, 13px);
      white-space: nowrap;
    }

    .progress-shell {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: #1b2a40;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #f5b942, #ffdd79);
      transition: width 0.4s ease;
    }

    .board-shell {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      border: 1px solid #32435e;
      border-radius: 10px;
      background: #0d1829;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.35);
    }

    .draft-board {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      width: 100%;
      height: 100%;
    }

    .team-column {
      min-width: 0;
      display: grid;
      grid-template-rows: 42px repeat(20, minmax(25px, 1fr));
      border-right: 1px solid #36445a;
    }

    .team-column:last-child {
      border-right: none;
    }

    .team-header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      background: linear-gradient(180deg, #f6a800, #db7f00);
      border-bottom: 2px solid #06101f;
      color: #111111;
      font-size: clamp(10px, 0.82vw, 16px);
      font-weight: 900;
      text-align: center;
      line-height: 1.05;
      overflow: hidden;
    }

    .pick-card {
      position: relative;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2px 4px 2px 17px;
      border-bottom: 1px solid rgba(7, 16, 31, 0.75);
      background: #dbe2ea;
      color: #111111;
      line-height: 1;
      overflow: hidden;
    }

    .pick-card:last-child {
      border-bottom: none;
    }

    .pick-number {
      position: absolute;
      left: 3px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(0, 0, 0, 0.48);
      font-size: clamp(7px, 0.53vw, 10px);
      font-weight: 800;
    }

    .player-name {
      width: 100%;
      overflow: hidden;
      font-size: clamp(8px, 0.72vw, 14px);
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-details {
      width: 100%;
      margin-top: 2px;
      overflow: hidden;
      color: rgba(0, 0, 0, 0.68);
      font-size: clamp(7px, 0.5vw, 10px);
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pick-empty {
      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.035),
          rgba(255, 255, 255, 0.015)
        );
      color: #65758c;
    }

    .pick-empty .player-name {
      color: #56667c;
    }

    .position-qb {
      background: #43a6e8;
    }

    .position-rb {
      background: #55cf62;
    }

    .position-wr {
      background: #59d8e8;
    }

    .position-te {
      background: #cb9bea;
    }

    .position-k {
      background: #f2f3f5;
    }

    .position-dl,
    .position-de,
    .position-dt {
      background: #e78576;
    }

    .position-lb {
      background: #f2df38;
    }

    .position-db,
    .position-cb,
    .position-s {
      background: #f05ae5;
    }

    .position-default {
      background: #cfd7e1;
    }

    .footer {
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      color: #9dadc3;
      font-size: clamp(8px, 0.62vw, 11px);
    }

    .legend {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 3px;
      font-weight: 800;
    }

    .legend-color {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }

    .error-banner {
      display: none;
      padding: 7px 12px;
      border-radius: 7px;
      background: #a52121;
      color: white;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    @media (max-width: 1100px) {
      body {
        padding: 4px;
      }

      .page {
        min-height: calc(100vh - 8px);
      }

      .top-bar {
        min-height: 48px;
        padding: 5px 9px;
      }

      .team-column {
        grid-template-rows: 34px repeat(20, minmax(22px, 1fr));
      }

      .pick-card {
        padding-left: 13px;
      }

      .footer {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="top-bar">
      <div class="league-title">
        <span>LFL</span> 2026 LIVE DRAFT
      </div>

      <div class="draft-status">
        <strong id="draftProgress">0 of 200 Picks</strong>
        <small id="currentStatus">Waiting for the draft to begin</small>
      </div>

      <div class="last-updated">
        <div>LIVE PUBLIC BOARD</div>
        <div id="updatedTime">Connecting…</div>
      </div>
    </header>

    <div class="progress-shell">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="error-banner" id="errorBanner"></div>

    <section class="board-shell">
      <div class="draft-board" id="draftBoard"></div>
    </section>

    <footer class="footer">
      <div class="legend">
        <span class="legend-item">
          <span class="legend-color position-qb"></span>QB
        </span>

        <span class="legend-item">
          <span class="legend-color position-rb"></span>RB
        </span>

        <span class="legend-item">
          <span class="legend-color position-wr"></span>WR
        </span>

        <span class="legend-item">
          <span class="legend-color position-te"></span>TE
        </span>

        <span class="legend-item">
          <span class="legend-color position-lb"></span>LB
        </span>

        <span class="legend-item">
          <span class="legend-color position-dl"></span>DL
        </span>

        <span class="legend-item">
          <span class="legend-color position-db"></span>DB
        </span>

        <span class="legend-item">
          <span class="legend-color position-k"></span>K
        </span>
      </div>

      <div>Automatically refreshes every 30 seconds</div>
    </footer>
  </main>

  <script>
    /*
      Replace the text between the quotation marks with the Apps Script
      web-app URL that ends in /exec.
    */

    const DRAFT_FEED_URL = "https://script.google.com/macros/s/AKfycbw0cu3nAnqe4x44C3bwJvnQq5wgRrXgMLh23lWZ8_vDbipWocHlx6wP-PuK0DBexWgpKw/exec

    const TEAM_ORDER = [
      "Jungle",
      "JDF",
      "PC DemBoyz",
      "Brew",
      "Iggles 4 Life",
      "Swamp",
      "Zoo",
      "Legacy",
      "Honey Pack",
      "Black Panther"
    ];

    const PICKS_PER_TEAM = 20;
    const REFRESH_INTERVAL = 30000;

    function normalizeTeamName(name) {
      return String(name || "")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");
    }

    function normalizePosition(position) {
      const pos = String(position || "").trim().toUpperCase();

      if (pos === "D/ST" || pos === "DST") {
        return "default";
      }

      return pos.toLowerCase() || "default";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function createEmptyBoard() {
      const board = document.getElementById("draftBoard");
      board.innerHTML = "";

      TEAM_ORDER.forEach(teamName => {
        const column = document.createElement("section");
        column.className = "team-column";
        column.dataset.team = normalizeTeamName(teamName);

        const header = document.createElement("div");
        header.className = "team-header";
        header.textContent = teamName;
        column.appendChild(header);

        for (let row = 1; row <= PICKS_PER_TEAM; row++) {
          const card = document.createElement("div");
          card.className = "pick-card pick-empty";

          card.innerHTML = `
            <span class="pick-number">${row}</span>
            <span class="player-name">—</span>
          `;

          column.appendChild(card);
        }

        board.appendChild(column);
      });
    }

    function renderBoard(data) {
      createEmptyBoard();

      const picksByTeam = {};

      TEAM_ORDER.forEach(team => {
        picksByTeam[normalizeTeamName(team)] = [];
      });

      const sortedPicks = [...(data.picks || [])].sort(
        (a, b) => Number(a.overallPick || 999) - Number(b.overallPick || 999)
      );

      sortedPicks.forEach(pick => {
        const teamKey = normalizeTeamName(pick.fantasyTeam);

        if (!picksByTeam[teamKey]) {
          return;
        }

        picksByTeam[teamKey].push(pick);
      });

      document.querySelectorAll(".team-column").forEach(column => {
        const teamKey = column.dataset.team;
        const teamPicks = picksByTeam[teamKey] || [];
        const cards = column.querySelectorAll(".pick-card");

        teamPicks.slice(0, PICKS_PER_TEAM).forEach((pick, index) => {
          const card = cards[index];
          const positionClass = normalizePosition(pick.position);

          card.className = `pick-card position-${positionClass}`;

          const details = [
            pick.nflTeam,
            pick.position
          ].filter(Boolean).join(" • ");

          card.innerHTML = `
            <span class="pick-number">${escapeHtml(pick.overallPick || index + 1)}</span>
            <span class="player-name">${escapeHtml(pick.player)}</span>
            <span class="player-details">${escapeHtml(details)}</span>
          `;
        });
      });

      const completedPicks = Number(data.completedPicks || 0);
      const totalPicks = Number(data.totalPicks || 200);
      const percentage = Math.min(
        100,
        Math.max(0, (completedPicks / totalPicks) * 100)
      );

      document.getElementById("draftProgress").textContent =
        `${completedPicks} of ${totalPicks} Picks`;

      document.getElementById("progressBar").style.width =
        `${percentage}%`;

      if (completedPicks === 0) {
        document.getElementById("currentStatus").textContent =
          "Waiting for the draft to begin";
      } else if (completedPicks >= totalPicks) {
        document.getElementById("currentStatus").textContent =
          "Draft complete";
      } else {
        document.getElementById("currentStatus").textContent =
          `Next selection: Pick ${completedPicks + 1}`;
      }

      const updatedDate = new Date(data.updatedAt || Date.now());

      document.getElementById("updatedTime").textContent =
        `Updated ${updatedDate.toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit",
          second: "2-digit"
        })}`;

      hideError();
    }

    function showError(message) {
      const banner = document.getElementById("errorBanner");
      banner.textContent = message;
      banner.style.display = "block";
    }

    function hideError() {
      document.getElementById("errorBanner").style.display = "none";
    }

    async function loadDraftData() {
      if (
        !DRAFT_FEED_URL ||
        DRAFT_FEED_URL.includes("PASTE_YOUR")
      ) {
        showError(
          "The Apps Script web-app URL has not been added yet."
        );
        return;
      }

      try {
        const response = await fetch(
          `${DRAFT_FEED_URL}?t=${Date.now()}`,
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(`Feed returned status ${response.status}`);
        }

        const data = await response.json();

        if (!data.success) {
          throw new Error(data.error || "The draft feed returned an error.");
        }

        renderBoard(data);
      } catch (error) {
        console.error(error);

        showError(
          "Unable to refresh the live draft feed. The board will try again automatically."
        );
      }
    }

    createEmptyBoard();
    loadDraftData();

    setInterval(loadDraftData, REFRESH_INTERVAL);
  </script>
</body>
</html>
